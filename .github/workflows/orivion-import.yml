name: Import Orivion project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace repository with project archive
        run: |
          mkdir -p /tmp/orivion-project
          unzip -q orivion-project.zip -d /tmp/orivion-project
          rsync -a --delete --exclude='.git/' /tmp/orivion-project/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete Orivion services website"
          git push origin HEAD:main
