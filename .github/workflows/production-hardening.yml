name: Production hardening

on:
  workflow_dispatch:
  push:
    paths:
      - "public/media/**/*.jpg"
      - "scripts/production-hardening.mjs"
      - ".github/workflows/production-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image optimizer
        run: npm install --no-save --package-lock=false sharp

      - name: Apply production hardening
        run: node scripts/production-hardening.mjs

      - name: Commit optimized production files
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "orivion-automation"
          git config user.email "actions@users.noreply.github.com"
          git add src public/media
          git commit -m "perf: harden production UX, forms and media"
          git push
