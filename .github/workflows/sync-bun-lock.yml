name: Sync Bun lockfile

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-bun-lock.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync dependencies and lockfile
        run: bun install

      - name: Verify production build with Bun
        run: bun run build

      - name: Commit updated Bun lockfile
        run: |
          git config user.name "orivion-automation"
          git config user.email "actions@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock already in sync"
            exit 0
          fi
          git commit -m "chore: sync Bun lockfile"
          git pull --rebase origin main
          git push origin HEAD:main
